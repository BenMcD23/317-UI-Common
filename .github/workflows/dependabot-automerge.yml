# Auto-merges Dependabot's minor/patch updates once the required checks pass.
# `--auto` makes GitHub wait for the ruleset's required checks, so a red CI run
# blocks the merge. Majors stay manual: that's where the breaking changes are.
# These are this repo's own dev tools and test libraries; an app only picks up
# a change here when a new version is released and bumped in it.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
